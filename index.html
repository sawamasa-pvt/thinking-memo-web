<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>思考メモ索引</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{color-scheme:light dark;
  --paper:#f5f7f7;--surface:#fff;--ink:#17212b;--ink-2:#46535f;--muted:#7a8792;
  --line:#dde3e4;--accent:#1f5f5b;--accent-ink:#fff;--bad:#a3372b}
@media (prefers-color-scheme:dark){:root{
  --paper:#11161b;--surface:#191f26;--ink:#e7ebee;--ink-2:#b4bdc6;--muted:#869199;
  --line:#2a333c;--accent:#74b8b1;--accent-ink:#10201f;--bad:#e08a7d}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font:16px/1.7 -apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  display:flex;align-items:center;justify-content:center;min-height:100dvh;padding:24px}
.card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);
  border-radius:3px;padding:26px 22px;display:flex;flex-direction:column;gap:14px}
h1{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:21px;margin:0;font-weight:600}
p{margin:0;color:var(--ink-2);font-size:13.5px}
label{font-size:12.5px;color:var(--muted)}
input[type=password]{width:100%;font-size:17px;padding:11px 12px;border:1px solid var(--line);
  border-radius:3px;background:var(--paper);color:var(--ink)}
button{font:inherit;font-size:15px;padding:11px 14px;border:1px solid var(--accent);
  border-radius:3px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
button[disabled]{opacity:.6;cursor:default}
.remember{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink-2)}
.msg{font-size:13px;min-height:1.2em}
.msg[data-err=yes]{color:var(--bad)}
.small{font-size:11.5px;color:var(--muted)}
</style>
</head>
<body>
<div class="card">
  <h1>思考メモ索引</h1>
  <p>669 ページ分の索引です。パスワードを入れると開きます。</p>
  <div>
    <label for="pw">パスワード</label>
    <input id="pw" type="password" autocomplete="current-password" enterkeyhint="go">
  </div>
  <div class="remember">
    <input id="save" type="checkbox">
    <label for="save">この端末で次回から自動で開く</label>
  </div>
  <button id="go">開く</button>
  <div class="msg" id="msg"></div>
  <div class="small">中身は AES-256-GCM で暗号化してあります。パスワードは端末の外に出ません。</div>
</div>

var ITER = 200000;
var KEY = 'tm_pw_v1';
var elPw = document.getElementById('pw');
var elGo = document.getElementById('go');
var elMsg = document.getElementById('msg');
var elSave = document.getElementById('save');

function b64(s) {
  var raw = atob(s), a = new Uint8Array(raw.length);
  for (var i = 0; i < raw.length; i++) a[i] = raw.charCodeAt(i);
  return a;
}
function say(t, err) {
  elMsg.textContent = t;
  if (err) { elMsg.setAttribute('data-err', 'yes'); } else { elMsg.removeAttribute('data-err'); }
}
function unlock(pw, quiet) {
  if (!pw) { say('パスワードを入れてください', true); return; }
  elGo.disabled = true;
  say('開いています…');
  var enc = new TextEncoder();
  crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey'])
    .then(function(base){
      return crypto.subtle.deriveKey(
        {name:'PBKDF2', salt:b64(ENC.salt), iterations:ITER, hash:'SHA-256'},
        base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    })
    .then(function(key){
      return crypto.subtle.decrypt({name:'AES-GCM', iv:b64(ENC.iv)}, key, b64(ENC.ct));
    })
    .then(function(buf){
      var html = new TextDecoder().decode(buf);
      try {
        if (elSave.checked) { localStorage.setItem(KEY, pw); }
      } catch (e) {}
      document.open();
      document.write(html);
      document.close();
    })
    .catch(function(){
      elGo.disabled = false;
      try { localStorage.removeItem(KEY); } catch (e) {}
      if (!quiet) { say('パスワードが違います', true); } else { say(''); }
    });
}
elGo.addEventListener('click', function(){ unlock(elPw.value, false); });
elPw.addEventListener('keydown', function(e){ if (e.key === 'Enter') unlock(elPw.value, false); });
(function(){
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved) { elSave.checked = true; unlock(saved, true); }
})();
</script>
